name: Frontend CI

on:
  push:
    branches: [ main, master ]
    paths: [ 'frontend/**', '.github/workflows/frontend-ci.yml', 'package.json' ]
  pull_request:
    branches: [ main, master ]
    paths: [ 'frontend/**', '.github/workflows/frontend-ci.yml', 'package.json' ]

jobs:
  build-and-lint:
    name: Build & Lint (Node.js 20)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: |
          cd frontend
          npm ci

      - name: Execute Type Check & Vite Production Build
        run: |
          cd frontend
          npm run build

      - name: Upload Frontend Dist Artifact
        uses: actions/upload-artifact@v4
        with:
          name: careeros-frontend-dist
          path: frontend/dist
          retention-days: 7

  docker-build:
    name: Docker Compilation
    needs: build-and-lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build Frontend Container Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: careeros-frontend:latest
