# Staging Profile Configuration — CareerOS AI Backend
spring:
  config:
    activate:
      on-profile: staging
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}}
    username: ${DATABASE_USERNAME:${PGUSER}}
    password: ${DATABASE_PASSWORD:${PGPASSWORD}}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 15
      minimum-idle: 3
      idle-timeout: 30000
      pool-name: CareerOS-StagingHikariPool

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false

logging:
  level:
    root: INFO
    com.careerosai: INFO
