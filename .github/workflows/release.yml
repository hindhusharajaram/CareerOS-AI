name: CareerOS AI Production Release

on:
  push:
    tags:
      - 'v*'

jobs:
  # =============================================================================
  # Production Release Packaging & Release Tagging Job
  # =============================================================================
  production-release:
    name: Production Release Generation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build Production Backend JAR
        run: |
          cd backend
          mvn clean package -DskipTests -B

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build Production Frontend Assets
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            backend/target/careeros-ai-backend-1.0.0.jar
            RELEASE_NOTES.md
            CHANGELOG.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
