# Production Profile Configuration — CareerOS AI Backend
spring:
  config:
    activate:
      on-profile: prod
  main:
    lazy-initialization: true
  datasource:
    url: ${DATABASE_URL:${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/careeros_ai_db}}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      leak-detection-threshold: 30000
      connection-timeout: 20000
      pool-name: CareerOS-ProdHikariPool

  jpa:
    open-in-view: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false

groq:
  api:
    key: ${GROQ_API_KEY:}

logging:
  level:
    root: INFO
    com.careerosai: INFO
    org.hibernate: WARN
    org.springframework.security: WARN
