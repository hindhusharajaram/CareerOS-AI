# Production Profile Configuration — CareerOS AI Backend
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}?sslmode=require}
    username: ${DATABASE_USERNAME:${PGUSER}}
    password: ${DATABASE_PASSWORD:${PGPASSWORD}}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      leak-detection-threshold: 30000
      connection-timeout: 20000
      pool-name: CareerOS-ProdHikariPool

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false

logging:
  level:
    root: INFO
    com.careerosai: INFO
    org.hibernate: WARN
    org.springframework.security: WARN
