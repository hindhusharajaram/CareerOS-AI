name: CareerOS AI Continuous Integration (CI)

on:
  push:
    branches: [ main, master, 'release/*' ]
  pull_request:
    branches: [ main, master ]

jobs:
  # =============================================================================
  # 1. Backend Build, Test & Code Quality Job
  # =============================================================================
  backend-ci:
    name: Backend Build & Test (Java 21)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Compile & Execute Backend Test Suite
        run: |
          cd backend
          mvn clean test -B

      - name: Package Backend Executable JAR
        run: |
          cd backend
          mvn package -DskipTests -B

      - name: Upload Backend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: careeros-backend-jar
          path: backend/target/careeros-ai-backend-1.0.0.jar
          retention-days: 7

  # =============================================================================
  # 2. Frontend Build, Lint & Asset Compilation Job
  # =============================================================================
  frontend-ci:
    name: Frontend Build & Lint (Node.js 20)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: |
          cd frontend
          npm ci

      - name: Execute Type Check & Vite Production Build
        run: |
          cd frontend
          npm run build

      - name: Upload Frontend Dist Artifact
        uses: actions/upload-artifact@v4
        with:
          name: careeros-frontend-dist
          path: frontend/dist
          retention-days: 7

  # =============================================================================
  # 3. Docker Multi-Stage Container Build Job
  # =============================================================================
  docker-ci:
    name: Docker Image Compilation
    needs: [backend-ci, frontend-ci]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Container Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: careeros-backend:latest

      - name: Build Frontend Container Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: careeros-frontend:latest
