name: Backend CI

on:
  push:
    branches: [ main, master ]
    paths: [ 'backend/**', '.github/workflows/backend-ci.yml', 'pom.xml' ]
  pull_request:
    branches: [ main, master ]
    paths: [ 'backend/**', '.github/workflows/backend-ci.yml', 'pom.xml' ]

jobs:
  build-and-test:
    name: Build & Test (Java 21)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Compile & Execute Backend Test Suite
        run: |
          cd backend
          mvn clean test -B

      - name: Package Backend Executable JAR
        run: |
          cd backend
          mvn package -DskipTests -B

      - name: Upload Backend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: careeros-backend-jar
          path: backend/target/careeros-ai-backend-1.0.0.jar
          retention-days: 7

  docker-build:
    name: Docker Compilation
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build Backend Container Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: careeros-backend:latest
