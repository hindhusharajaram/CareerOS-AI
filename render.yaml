services:
  - type: web
    name: careeros-ai-backend
    env: docker
    rootDir: backend
    plan: free
    healthCheckPath: /api/v1/observability/health
    envVars:
      - key: PORT
        value: 8080
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: JAVA_OPTS
        value: "-Xms128m -Xmx300m -XX:+UseG1GC"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
