# Production Profile Configuration — CareerOS AI Backend
spring:
  config:
    activate:
      on-profile: prod
  main:
    lazy-initialization: true
  datasource:
    url: ${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:postgresql://localhost:5432/careeros_ai_db}}
    username: ${SPRING_DATASOURCE_USERNAME:${DATABASE_USERNAME:${PGUSER:neondb_owner}}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DATABASE_PASSWORD:${PGPASSWORD:}}}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      leak-detection-threshold: 30000
      connection-timeout: 20000
      pool-name: CareerOS-ProdHikariPool

  jpa:
    open-in-view: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false

groq:
  api:
    key: ${GROQ_API_KEY:}


logging:
  level:
    root: INFO
    com.careerosai: INFO
    org.hibernate: WARN
    org.springframework.security: WARN
